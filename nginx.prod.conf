# HTTP 强制跳转 HTTPS
server {
    listen 80;
    server_name huanliyu.cn www.huanliyu.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name huanliyu.cn www.huanliyu.cn;

    ssl_certificate     /etc/nginx/certs/huanliyu.cn_bundle.crt;
    ssl_certificate_key /etc/nginx/certs/huanliyu.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    # 必须与 backend 的 MAX_UPLOAD_MB 对齐，Nginx 默认只有 1m
    client_max_body_size 10m;

    # 前端是 SPA，未知路径回落 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite 产物带内容哈希，可长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://api:39800;      # api 是 compose 服务名，走内网 DNS
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 实时进度：必须关缓冲，否则进度会被攒着不发
        proxy_buffering off;
        proxy_cache off;
        # ARQ 单任务上限 15 分钟（worker/settings.py），读超时要放宽
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }
}
