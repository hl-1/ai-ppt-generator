server:
  port: ${SERVER_PORT:39800}
  shutdown: graceful

spring:
  application:
    name: ai-ppt-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${app.jdbc-url}
    username: ${app.jdbc-username}
    password: ${app.jdbc-password}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 2000
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:39379/0}
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_MB:10}MB
      max-request-size: ${MAX_UPLOAD_MB:10}MB
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: ALWAYS
    serialization:
      write-dates-as-timestamps: false
      write-durations-as-timestamps: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: input

app:
  env: ${APP_ENV:development}
  database-url: ${DATABASE_URL:postgresql+asyncpg://aippt:aippt@localhost:39432/aippt}
  cors-origins: ${CORS_ORIGINS:["http://localhost:39173","http://127.0.0.1:39173"]}
  jwt-secret: ${JWT_SECRET:dev-only-insecure-secret-change-me}
  jwt-algorithm: ${JWT_ALGORITHM:HS256}
  jwt-expire-minutes: ${JWT_EXPIRE_MINUTES:10080}
  llm-api-key: ${LLM_API_KEY:}
  llm-base-url: ${LLM_BASE_URL:https://api.deepseek.com}
  llm-model: ${LLM_MODEL:deepseek-v4-flash}
  llm-thinking-enabled: ${LLM_THINKING_ENABLED:false}
  llm-timeout-seconds: ${LLM_TIMEOUT_SECONDS:60}
  slide-concurrency: ${SLIDE_CONCURRENCY:3}
  image-provider: ${IMAGE_PROVIDER:openai}
  image-api-key: ${IMAGE_API_KEY:}
  image-base-url: ${IMAGE_BASE_URL:https://api.openai.com/v1}
  image-model: ${IMAGE_MODEL:gpt-image-1}
  image-workspace-id: ${IMAGE_WORKSPACE_ID:}
  image-timeout-seconds: ${IMAGE_TIMEOUT_SECONDS:60}
  unsplash-access-key: ${UNSPLASH_ACCESS_KEY:}
  storage-driver: ${STORAGE_DRIVER:local}
  storage-local-dir: ${STORAGE_LOCAL_DIR:}
  cos-bucket: ${COS_BUCKET:}
  cos-region: ${COS_REGION:}
  cos-secret-id: ${COS_SECRET_ID:}
  cos-secret-key: ${COS_SECRET_KEY:}
  max-upload-mb: ${MAX_UPLOAD_MB:10}
  max-image-mb: ${MAX_IMAGE_MB:8}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
